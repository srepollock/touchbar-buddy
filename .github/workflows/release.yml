# Release pipeline:
# 1. release-please keeps a Release PR open on trunk (version in
#    Resources/Info.plist and CHANGELOG.md).
# 2. Merging it tags the release; build-release then builds the universal
#    app, zips it (ad-hoc signed) and attaches it to the GitHub Release.
name: release

on:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    uses: ./.github/workflows/reusable-release-please.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      release_branch: trunk

  build-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      # Uses the runner image's default (stable) Xcode; Package.swift needs Swift >= 6.0.
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build universal release app
        run: scripts/build-app.sh release

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          zip="TouchBuddy-${VERSION}-macos-universal.zip"
          ditto -c -k --keepParent build/TouchBuddy.app "$zip"
          gh release upload "$TAG" "$zip" --repo "$REPO" --clobber
